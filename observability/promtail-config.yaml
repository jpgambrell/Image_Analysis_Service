server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from all Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Add service label for our microservices
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Add project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    # Pipeline stages to parse and structure logs
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            imageId: imageId
            correlationId: correlationId
            service: service
            error: error

      # Extract log level
      - labels:
          level:
          imageId:
          correlationId:

      # Parse timestamp if present
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z"

      # Add output format
      - output:
          source: message

  # Specific job for upload-service
  - job_name: upload-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.service=upload-service']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'upload-service'
        target_label: 'service'
      - replacement: 'microservice'
        target_label: 'type'
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            imageId: imageId
            correlationId: correlationId
            filename: filename
            action: action
      - labels:
          level:
          imageId:
          correlationId:
          action:

  # Specific job for analysis-service
  - job_name: analysis-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ['com.docker.compose.service=analysis-service']
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - replacement: 'analysis-service'
        target_label: 'service'
      - replacement: 'microservice'
        target_label: 'type'
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            imageId: imageId
            correlationId: correlationId
            filename: filename
            action: action
            keywords: keywords
      - labels:
          level:
          imageId:
          correlationId:
          action:
