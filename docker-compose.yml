version: '3.8'

services:
  # Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      # Listeners
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Cluster settings
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Topic auto creation
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'

      # Log settings
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      KAFKA_CFG_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - kafka-net
    healthcheck:
      test: kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Upload Service
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: upload-service
      KAFKA_TOPIC_UPLOAD: image-uploaded
      UPLOAD_DIR: /app/images
      MAX_FILE_SIZE: 10485760
      ALLOWED_FORMATS: image/jpeg,image/png,image/gif,image/webp
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Analysis Service
  analysis-service:
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    container_name: analysis-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: analysis-service
      KAFKA_GROUP_ID: analysis-group
      KAFKA_TOPIC_UPLOAD: image-uploaded
      KAFKA_TOPIC_ANALYSIS: image-analyzed
      IMAGES_DIR: /app/images
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
    driver: local
  images-volume:
    driver: local

networks:
  kafka-net:
    driver: bridge
