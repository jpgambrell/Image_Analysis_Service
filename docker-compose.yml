services:
  # Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Upload Service
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: upload-service
      KAFKA_TOPIC_UPLOAD: image-uploaded
      UPLOAD_DIR: /app/images
      MAX_FILE_SIZE: 10485760
      ALLOWED_FORMATS: image/jpeg,image/png,image/gif,image/webp
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Analysis Service
  analysis-service:
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    container_name: analysis-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: analysis-service
      KAFKA_GROUP_ID: analysis-group
      KAFKA_TOPIC_UPLOAD: image-uploaded
      KAFKA_TOPIC_ANALYSIS: image-analyzed
      IMAGES_DIR: /app/images
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
    driver: local
  images-volume:
    driver: local

networks:
  kafka-net:
    driver: bridge
