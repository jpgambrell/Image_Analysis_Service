services:
  # Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Upload Service
  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: upload-service
      KAFKA_TOPIC_UPLOAD: image-uploaded
      UPLOAD_DIR: /app/images
      MAX_FILE_SIZE: 10485760
      ALLOWED_FORMATS: image/jpeg,image/png,image/gif,image/webp
      DATABASE_URL: postgresql://imageservice:imageservice_password@postgres:5432/imageservice
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Analysis Service
  analysis-service:
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    container_name: analysis-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: analysis-service
      KAFKA_GROUP_ID: analysis-group
      KAFKA_TOPIC_UPLOAD: image-uploaded
      KAFKA_TOPIC_ANALYSIS: image-analyzed
      IMAGES_DIR: /app/images
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://imageservice:imageservice_password@postgres:5432/imageservice
    volumes:
      - images-volume:/app/images
    networks:
      - kafka-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # Ollama Service for LLaVA image analysis
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - images-volume:/images:ro
      - ollama-models:/root/.ollama
    networks:
      - kafka-net
    restart: unless-stopped
    # Uncomment if you have NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: imageservice
      POSTGRES_USER: imageservice
      POSTGRES_PASSWORD: imageservice_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageservice -d imageservice"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Loki - Log aggregation system
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - kafka-net
    restart: unless-stopped

  # Promtail - Log collection agent
  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - kafka-net
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - kafka-net
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  kafka-data:
    driver: local
  images-volume:
    driver: local
  ollama-models:
    driver: local
  postgres-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local

networks:
  kafka-net:
    driver: bridge
